name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Mac agent
        run: xcrun swiftc -O -o clipbridge mac/Sources/*.swift
      - name: Refuses to start without a host
        run: |
          set +e
          ./clipbridge; code=$?
          test "$code" -eq 64
      - name: Signature tests
        run: |
          xcrun swiftc -o signature-tests mac/Sources/Signature.swift tests/signature.tests.swift
          ./signature-tests

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck install.sh uninstall.sh

  lint-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Listener tests (Windows PowerShell 5)
        shell: cmd
        run: powershell -NoProfile -STA -ExecutionPolicy Bypass -File tests\listener.tests.ps1
